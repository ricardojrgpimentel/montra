name: android

# As actions estão presas ao commit exacto, não a uma tag: uma tag pode ser
# reapontada por quem controla a action. O Dependabot sobe estes pins.

# Build and test the client, and prove that the catalogue shipping inside it still
# verifies. The unit tests include a real signature check against the real index
# bytes, so a broken crypto path fails the build instead of reaching a phone.
on:
  push:
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
  workflow_dispatch:

concurrency:
  # Um push atrás do outro não precisa de dois builds de 10 minutos em paralelo.
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: build-tools do Android SDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --install "build-tools;36.0.0" "platforms;android-36" > /dev/null
          "$SDKMANAGER" --list_installed | grep -E "build-tools;36" || true

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: testes unitários
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: APK de debug
        run: ./gradlew :app:assembleDebug --console=plain

      - name: APK de release (minificado, sem assinatura de publicação)
        run: ./gradlew :app:assembleRelease --console=plain

      - name: lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: publicar o APK de debug
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: montra-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: resumo
        run: |
          echo "### Montra" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| artefacto | tamanho |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          ls -l app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk 2>/dev/null |
            awk '{printf "| %s | %d KB |\n", $9, $5/1024}' >> "$GITHUB_STEP_SUMMARY"
